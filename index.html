<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invoice Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2F1;--pn:#fff;--in:#F6F8F8;--tx:#0F172A;--mu:#64748B;--ln:#E2E8F0;--ac:#0E9C97;--ad:#E4F5F4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1120;--pn:#111A2E;--in:#0B1220;--tx:#E5E7EB;--mu:#94A3B8;--ln:#1F2A44;--ad:#0E2F35}}
:root[data-theme="dark"]{--bg:#0B1120;--pn:#111A2E;--in:#0B1220;--tx:#E5E7EB;--mu:#94A3B8;--ln:#1F2A44;--ad:#0E2F35}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 Inter,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--pn);z-index:10}
.tb{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;background:var(--pn);border-bottom:1px solid var(--ln)}
.tb h1{font:700 17px 'Space Grotesk',sans-serif;margin:0 auto 0 0}
.tb h1 i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ac);margin-right:8px}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{border:1px solid var(--ln);background:var(--in);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--ac)}
button.pr{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.app{display:grid;grid-template-columns:minmax(300px,400px) 1fr;gap:20px;padding:20px;max-width:1280px;margin:auto}
.ed{display:flex;flex-direction:column;gap:14px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:14px}
.card h3{margin:0 0 10px;font:600 11px 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ac)}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
input,textarea,select{width:100%;background:var(--in);border:1px solid var(--ln);border-radius:8px;padding:7px 9px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--ac);outline-offset:-1px}
textarea{min-height:64px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row{display:grid;grid-template-columns:1fr 54px 84px 30px;gap:6px;margin-bottom:6px}
.row.p{grid-template-columns:1fr 112px 78px 70px 30px}
.row button{padding:0}
.wrap{overflow-x:auto}
.sheet{--ink:#0F172A;--m:#64748B;--l:#E2E8F0;background:#fff;color:var(--ink);width:800px;max-width:100%;margin:auto;border-radius:12px;overflow:hidden;border:1px solid var(--l);box-shadow:0 20px 40px -20px rgba(15,23,42,.25);font-size:14px}
.sheet .st{display:flex;justify-content:space-between;background:var(--ink);color:#CBD5E1;padding:9px 36px;font:11.5px 'JetBrains Mono',monospace}
.sheet .st i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ac);margin-right:8px}
.sheet .st b{color:#fff;font-weight:500}
.bd{padding:36px}
.hd{display:flex;justify-content:space-between;gap:20px;margin-bottom:26px}
.badge{display:inline-block;background:var(--ink);color:#fff;font:700 13px 'Space Grotesk',sans-serif;padding:5px 12px;border-radius:6px;margin-bottom:10px}
.hd h2{font:700 21px 'Space Grotesk',sans-serif;margin:0;letter-spacing:-.01em}
.hd h1{font:700 30px 'Space Grotesk',sans-serif;margin:0;letter-spacing:-.02em;text-align:right}
.mono{font:12px/1.6 'JetBrains Mono',monospace;color:var(--m);margin:4px 0 0}
.r{text-align:right}.r .mono b{color:var(--ink);font-weight:500}
.sheet h6{font:600 10.5px 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ac);margin:0 0 6px}
.to{margin:0 0 22px;padding-bottom:20px;border-bottom:1px dashed var(--l);line-height:1.6}
.sheet table{width:100%;border-collapse:collapse;table-layout:auto}
.sheet th{text-align:left;padding:0 10px 9px 0;font:600 10.5px 'JetBrains Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--m);border-bottom:2px solid var(--ink)}
.sheet td{padding:11px 10px 11px 0;border-bottom:1px solid var(--l)}
.sheet .n{text-align:right;white-space:nowrap}
.tot{width:270px;margin:16px 0 22px auto;background:var(--ink);color:#fff;border-radius:10px;padding:13px 18px;display:flex;justify-content:space-between;align-items:center}
.tot span{font:500 11px 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#2DD4CF}
.tot b{font:700 21px 'Space Grotesk',sans-serif}
.pill{font:600 10.5px 'JetBrains Mono',monospace;text-transform:uppercase;padding:3px 10px;border-radius:20px;background:var(--ad);color:#0E9C97}
.pill.d{background:#FEF3E2;color:#B45309}
.bal{text-align:right;font:12px 'JetBrains Mono',monospace;color:var(--m);margin:8px 0 22px}
.pay{background:#E4F5F4;border:1px solid #CFEEEC;border-radius:10px;padding:14px 18px;margin:0 0 26px;line-height:1.65}
.ft{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
.ty{font:600 18px 'Space Grotesk',sans-serif}
.ty:before{content:"";display:inline-block;width:18px;height:2px;background:var(--ac);vertical-align:middle;margin-right:10px}
.ic{display:flex;gap:8px;margin-top:10px}.ic a{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--l);background:#F6F8F8;border-radius:6px;color:#64748B;text-decoration:none}.ic svg{width:14px;height:14px;fill:currentColor}
.sg img{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100% - 3px);height:48px;max-width:100%}
.sg{position:relative;width:200px;margin-top:56px;border-top:1px solid #94A3B8;padding-top:5px;text-align:center;font:11.5px 'JetBrains Mono',monospace;color:var(--m)}
@media (max-width:900px){.app{grid-template-columns:1fr;padding:12px}}
@page{size:A4;margin:0}
@media print{body{background:#fff;padding:10mm}body::before,.tb,.ed{display:none}.app{display:block;padding:0}.sheet{box-shadow:none;border:0;border-radius:0;width:auto}.wrap{overflow:visible}.bd{padding:22px 28px}.sheet .st{padding:8px 28px}.hd{margin-bottom:16px}.to{margin-bottom:14px;padding-bottom:12px}.sheet td{padding:8px 10px 8px 0}.tot{margin:10px 0 14px}.pay{margin-bottom:16px;padding:10px 16px}.sg{margin-top:44px}.sg img{height:38px}.sheet,.sheet *{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<div class="tb">
  <h1><i></i>Invoice Studio</h1>
  <select id="sv" style="width:auto;max-width:240px" aria-label="Saved invoices"></select>
  <button data-a="new">New</button><button data-a="save">Save</button><button data-a="del">Delete</button>
  <button class="pr" data-a="print">Print / PDF</button>
</div>
<div class="app">
  <div class="ed">
    <div class="card"><h3>Invoice</h3>
      <label>Invoice number</label><input data-k="no">
      <div class="g2"><div><label>Date</label><input type="date" data-k="date"></div><div><label>Due date</label><input type="date" data-k="due"></div></div>
      <label>Currency</label><select data-k="cur"><option>USD</option><option>EUR</option><option>GBP</option><option>BDT</option></select></div>
    <div class="card"><h3>Billed to</h3>
      <label>Client name</label><input data-k="to.name">
      <label>Address &amp; tax IDs</label><textarea data-k="to.addr"></textarea></div>
    <div class="card"><h3>Items</h3><div id="it"></div><button data-add="items">+ Add item</button></div>
    <div class="card"><h3>Payments received / due</h3><div id="pa"></div><button data-add="pays">+ Add installment</button>
      <p class="mono" style="color:var(--mu)">Leave empty for a single unpaid invoice.</p></div>
    <div class="card"><h3>Payment method</h3>
      <textarea data-k="method"></textarea>
      <label>Note (e.g. exchange rate)</label><input data-k="note"></div>
    <div class="card"><h3>Signature</h3><select data-k="sig"><option value="blank">Blank — sign by hand</option><option value="digital">Digital signature</option></select><div id="sgu"><label>Signature photo (upload once — background is removed automatically)</label><input type="file" id="sgf" accept="image/*"></div><p class="mono" style="color:var(--mu)">Choose per invoice. Digital prints your uploaded signature above the line.</p></div>
    <div class="card"><h3>Your details</h3>
      <div class="g2"><div><label>Logo text</label><input data-k="from.badge"></div><div><label>TIN</label><input data-k="from.tin"></div></div>
      <label>Name</label><input data-k="from.name">
      <label>Address</label><input data-k="from.addr">
      <label>Portfolio link</label><input data-k="links.web"><label>LinkedIn link</label><input data-k="links.li"><label>WhatsApp link</label><input data-k="links.wa"><label>Fiverr link</label><input data-k="links.fv"><p class="mono" style="color:var(--mu)">Shown as logos on the invoice. Leave a field empty to hide that logo.</p></div>
  </div>
  <div class="wrap"><div class="sheet" id="sh"></div></div>
</div>
<script>
const $=s=>document.querySelector(s),K='rhr_invoice_studio_v1',today=new Date().toISOString().slice(0,10);
const SEED={id:'seed',no:'INV-',date:today,due:'',cur:'USD',
from:{badge:'RHR',name:'MD. RAKIBUL HASAN RIZVI',addr:'Badda Link Road, Dhaka-1212, Bangladesh',tin:'779584523123'},
to:{name:'',addr:''},
items:[{d:'',q:1,p:0}],
pays:[],
method:'bKash\nAccount name: MD. RAKIBUL HASAN RIZVI\nAccount no.: +880-1951-016688',note:'',
links:{web:'rakibulhasanrizvi.github.io',li:'linkedin.com/in/rakibulhasanrizvi',wa:'wa.me/8801679343895',fv:'fiverr.com/sellers/r_i_z_v_i'}};
let db={list:[],cur:null},S;
try{db=JSON.parse(localStorage.getItem(K))||db}catch(e){}
const norm=x=>{if(!x.links||typeof x.links!='object')x.links=structuredClone(SEED.links);if(!x.sig)x.sig='blank';if(x.sigImg===undefined)x.sigImg='';return x};
S=norm(db.cur||structuredClone(SEED));
const persist=()=>{db.cur=S;try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}};
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),br=t=>esc(t).replace(/\n/g,'<br>');
const m=n=>S.cur+' '+(+n||0).toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2});
const fd=d=>d?new Date(d+'T00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'';
const get=k=>k.split('.').reduce((o,p)=>o?.[p],S);
function set(k,v){const p=k.split('.'),l=p.pop(),o=p.reduce((o,x)=>o[x],S);o[l]=/\.[qpa]$/.test(k)?(parseFloat(v)||0):v}
function lists(){
 $('#it').innerHTML=S.items.map((r,i)=>`<div class="row"><input data-k="items.${i}.d" placeholder="Description"><input data-k="items.${i}.q" type="number" step="any" title="Qty"><input data-k="items.${i}.p" type="number" step="any" title="Unit price"><button data-x="items.${i}" aria-label="Remove">×</button></div>`).join('');
 $('#pa').innerHTML=S.pays.map((r,i)=>`<div class="row p"><input data-k="pays.${i}.l" placeholder="Label"><input type="date" data-k="pays.${i}.dt"><input data-k="pays.${i}.a" type="number" step="any" title="Amount"><select data-k="pays.${i}.s"><option>Paid</option><option>Due</option></select><button data-x="pays.${i}" aria-label="Remove">×</button></div>`).join('');
 const o='<option value="">— Saved invoices —</option>'+db.list.map(x=>`<option value="${esc(x.id)}"${x.id==S.id?' selected':''}>${esc(x.no)} · ${esc(x.to.name)}</option>`).join('');
 $('#sv').innerHTML=o;fill();
}
function fill(){document.querySelectorAll('[data-k]').forEach(e=>e.value=get(e.dataset.k)??'')}
const IC={web:'M12 .5C5.65.5.5 5.65.5 12c0 5.09 3.29 9.4 7.86 10.93.58.11.79-.25.79-.56 0-.27-.01-1.17-.02-2.12-3.2.7-3.87-1.36-3.87-1.36-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.7.08-.7 1.17.08 1.78 1.2 1.78 1.2 1.03 1.77 2.71 1.26 3.37.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.68 0-1.25.45-2.28 1.19-3.08-.12-.29-.51-1.46.11-3.04 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.8 0c2.21-1.49 3.18-1.18 3.18-1.18.62 1.58.23 2.75.11 3.04.74.8 1.19 1.83 1.19 3.08 0 4.41-2.69 5.38-5.25 5.67.41.36.78 1.06.78 2.14 0 1.55-.01 2.79-.01 3.17 0 .31.21.68.8.56A10.51 10.51 0 0 0 23.5 12c0-6.35-5.15-11.5-11.5-11.5Z',li:'M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.34V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.38-1.85 3.61 0 4.28 2.38 4.28 5.47v6.27ZM5.34 7.43a2.07 2.07 0 1 1 0-4.13 2.07 2.07 0 0 1 0 4.13ZM7.12 20.45H3.56V9h3.56v11.45Z',wa:'M17.47 14.38c-.29-.15-1.7-.84-1.96-.93-.26-.1-.46-.15-.65.15-.19.29-.75.93-.92 1.12-.17.19-.34.22-.63.07-.29-.15-1.22-.45-2.32-1.44-.86-.76-1.44-1.7-1.61-1.99-.17-.29-.02-.45.13-.6.13-.13.29-.34.44-.51.15-.17.19-.29.29-.48.1-.19.05-.36-.02-.51-.07-.15-.65-1.58-.9-2.16-.24-.58-.48-.5-.65-.51h-.56c-.19 0-.5.07-.77.36-.26.29-1.01.99-1.01 2.41 0 1.42 1.03 2.79 1.18 2.98.15.19 2.02 3.09 4.9 4.33.68.29 1.22.47 1.63.6.68.22 1.31.19 1.8.11.55-.08 1.7-.7 1.94-1.37.24-.68.24-1.25.17-1.37-.07-.12-.26-.19-.55-.34ZM12.02 21.9h-.01a9.87 9.87 0 0 1-5.02-1.38l-.36-.21-3.73.98.99-3.63-.24-.37a9.87 9.87 0 1 1 18.35-5.13c0 5.44-4.44 9.74-9.98 9.74Zm8.41-18.14A11.82 11.82 0 0 0 12.02.15C5.5.15.15 5.5.15 12.02c0 2.12.55 4.19 1.6 6.02L.05 23.85l5.95-1.56a11.86 11.86 0 0 0 5.99 1.62h.01c6.53 0 11.87-5.35 11.87-11.87a11.8 11.8 0 0 0-3.44-8.28Z',fv:'M23.004 15.588a.995.995 0 1 0 .002-1.99.995.995 0 0 0-.002 1.99zm-.996-3.705h-.85c-.546 0-.84.41-.84 1.092v2.466h-1.61v-3.558h-.684c-.547 0-.84.41-.84 1.092v2.466h-1.61v-4.874h1.61v.74c.264-.574.626-.74 1.163-.74h1.972v.74c.264-.574.625-.74 1.162-.74h.527v1.316zm-6.786 1.501h-3.359c.088.546.43.858 1.006.858.43 0 .732-.175.83-.487l1.425.4c-.351.848-1.22 1.364-2.255 1.364-1.748 0-2.549-1.355-2.549-2.515 0-1.14.703-2.505 2.45-2.505 1.856 0 2.471 1.384 2.471 2.408 0 .224-.01.37-.02.477zm-1.562-.945c-.04-.42-.342-.81-.889-.81-.508 0-.81.225-.908.81h1.797zM7.508 15.44h1.416l1.767-4.874h-1.62l-.86 2.837-.878-2.837H5.72l1.787 4.874zm-6.6 0H2.51v-3.558h1.524v3.558h1.591v-4.874H2.51v-.302c0-.332.235-.536.606-.536h.918V8.412H2.85c-1.162 0-1.943.712-1.943 1.755v.4H0v1.316h.908v3.558z'},TI={web:'Portfolio',li:'LinkedIn',wa:'WhatsApp',fv:'Fiverr'};
const href=u=>/^https?:/.test(u)?u:'https://'+u;
const icons=()=>Object.keys(IC).filter(k=>S.links[k]).map(k=>`<a href="${esc(href(S.links[k]))}" target="_blank" title="${TI[k]}" aria-label="${TI[k]}"><svg viewBox="0 0 24 24"><path d="${IC[k]}"/></svg></a>`).join('');
function view(){
 const tot=S.items.reduce((a,i)=>a+i.q*i.p,0),paid=S.pays.filter(p=>p.s=='Paid').reduce((a,p)=>a+p.a,0),bal=tot-paid,f=S.from;
 $('#sh').innerHTML=`<div class="st"><span><i></i>invoice / ${esc(S.no)}</span><span>due <b>${esc(fd(S.due))}</b></span></div><div class="bd">
<div class="hd"><div><span class="badge">.${esc(f.badge)}.</span><h2>${esc(f.name)}</h2><p class="mono">${esc(f.addr)}<br>TIN: ${esc(f.tin)}</p></div>
<div class="r"><h1>INVOICE</h1><p class="mono">Invoice # <b>${esc(S.no)}</b><br>Date <b>${esc(fd(S.date))}</b></p></div></div>
<h6>Billed to</h6><p class="to"><b>${esc(S.to.name)}</b><br>${br(S.to.addr)}</p>
<table><tr><th>Item</th><th class="n">Qty</th><th class="n">Unit price</th><th class="n">Total</th></tr>${S.items.map(i=>`<tr><td>${esc(i.d)}</td><td class="n">${i.q}</td><td class="n">${m(i.p)}</td><td class="n">${m(i.q*i.p)}</td></tr>`).join('')}</table>
<div class="tot"><span>Total</span><b>${m(tot)}</b></div>
${S.pays.length?`<table><tr><th>Installment</th><th>Date</th><th class="n">Amount</th><th class="n">Status</th></tr>${S.pays.map(p=>`<tr><td>${esc(p.l)}</td><td>${esc(fd(p.dt))}</td><td class="n">${m(p.a)}</td><td class="n"><span class="pill ${p.s=='Paid'?'':'d'}">${p.s}</span></td></tr>`).join('')}</table>
<p class="bal">${bal<=.004?'✓ Paid in full':'Paid '+m(paid)+' · Balance due <b>'+m(bal)+'</b>'}</p>`:''}
<div class="pay"><h6>Payment method</h6>${br(S.method)}${S.note?`<p class="mono">${esc(S.note)}</p>`:''}</div>
<div class="ft"><div><div class="ty">Thank you for your business</div><div class="ic">${icons()}</div></div><div class="sg">${S.sig=='digital'&&S.sigImg?`<img src="${S.sigImg}" alt="">`:''}Authorized signature</div></div></div>`;
 $('#sgu').style.display=S.sig=='digital'?'':'none';
 document.title='Invoice — '+(S.to.name||S.no);
}
document.addEventListener('input',e=>{const k=e.target.dataset.k;if(k){set(k,e.target.value);view();persist()}});
document.addEventListener('change',e=>{if(e.target.id=='sv'&&e.target.value){const x=db.list.find(i=>i.id==e.target.value);if(x){S=norm(structuredClone(x));persist();lists();view()}}});
document.addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.add){S[d.add].push(d.add=='items'?{d:'',q:1,p:0}:{l:'',dt:today,a:0,s:'Paid'})}
 else if(d.x){const[a,i]=d.x.split('.');S[a].splice(+i,1)}
 else if(d.a=='print'){window.print();return}
 else if(d.a=='save'){const i=db.list.findIndex(x=>x.id==S.id);const c=structuredClone(S);i<0?db.list.unshift(c):db.list[i]=c}
 else if(d.a=='del'){db.list=db.list.filter(x=>x.id!=S.id);d.a='new'}
 if(d.a=='new'){const o=S;S={...structuredClone(SEED),id:Date.now()+'',no:'INV-',date:today,due:'',cur:o.cur,from:structuredClone(o.from),method:o.method,note:'',links:structuredClone(o.links),sig:'blank',sigImg:o.sigImg,to:{name:'',addr:''},items:[{d:'',q:1,p:0}],pays:[]}}
 persist();lists();view();
});
$('#sgf').addEventListener('change',e=>{
 const f=e.target.files[0];if(!f)return;const im=new Image();
 im.onload=()=>{
  const w=Math.min(700,im.width),h=Math.round(im.height*w/im.width),c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d');x.drawImage(im,0,0,w,h);const d=x.getImageData(0,0,w,h),p=d.data,g=[];
  for(let i=0;i<p.length;i+=4)g.push((p[i]+p[i+1]+p[i+2])/3);
  const bg=[...g].sort((a,b)=>a-b)[Math.floor(g.length*.9)],hi=bg*.6,lo=bg*.25;
